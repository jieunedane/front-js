<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첨부파일 썸네일</title>
    <style>
        div.image {
            width: 300px;
            height: 300px;
            cursor: pointer;
            background-image: url(./images/basic.jpg);
            background-size: 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        input[type='file'] {
            display: none;
        }

        div.wrap {
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            position: relative;
        }

        div.cancel {
            display: none;
            cursor: pointer;
            width: 20px;
            height: 20px;
            position: absolute;
            z-index: 10;
            top: 12px;
            right: 12px;
            background-image: url(./images/cancel.png);
            background-size: 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

    </style>
</head>
<body>
    <form action="">
        <div class="wrap">
            <label for="attach">
                <div class="image"></div>
            </label>
            <div class="cancel"></div>
        </div>
        <input type="file" id="attach">
    </form>
</body>
<script>
    const input = document.querySelector("#attach")
    const thumbnail = document.querySelector("div.image")
    const cancel = document.querySelector(".cancel")

    input.addEventListener("change", (e) => {
        const reader = new FileReader()
        reader.readAsDataURL(e.target.files[0])
        reader.onload = (e) => {
            const result = e.target.result
            if(result.includes("image")){
                thumbnail.style.backgroundImage = `url(${result})`
                cancel.style.display = "block"
            }else {
                thumbnail.style.backgroundImage = `url(./images/basic.jpg)`
            }
        }
    })

    cancel.addEventListener("click", (e) => {
        input.value = ""
        thumbnail.style.backgroundImage = `url(./images/basic.jpg)`
        cancel.style.display = "none"
    }) 
</script>
</html>
