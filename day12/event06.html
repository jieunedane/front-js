<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체크박스의 동의</title>
</head>
<body>
    <form action="" name="myForm">
      <div>
        <label>
          전체 동의
          <input type="checkbox" name="all" class="all" />
        </label>
      </div>
      <div>
        <label>
          서비스 이용약관 동의
          <input type="checkbox" name="term1" class="term" />
        </label>
      </div>
      <div>
        <label>
          광고 수신 동의
          <input type="checkbox" name="term2" class="term" />
        </label>
      </div>
      <div>
        <label>
          개인 정보 이용약관 동의
          <input type="checkbox" name="term3" class="term" />
        </label>
      </div>
    </form>
</body>
<script>
    // 전체 동의 완료 조직
    NodeList.prototype.filter = Array.prototype.filter
    
    const checkbox1 = document.querySelectorAll("input[name='term1']")
    const checkbox2 = document.querySelectorAll("input[name='term2']")
    const checkbox3 = document.querySelectorAll("input[name='term3']")
    console.log(checkbox1)
    console.log(checkbox2)
    console.log(checkbox3)

    // checkboxes.forEach((checkbox) =>    {

    // })
</script>
</html>
