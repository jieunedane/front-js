<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch후 데이터 화면에 출력</title>
    <style>
        .though {
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <ul id="todos"></ul>
</body>
<script>

    const ul = document.querySelector("#todos")
    
    // https://jsonplaceholder.typicode.com/todos
    const fetchTodos = async () => {
        const response = await fetch("https://jsonplaceholder.typicode.com/todos")
        // Response -> Object
        const todos = await response.json()
        return todos 
    }

    fetchTodos()
        .then((todos) => {
            // todos를 반복돌면서 li태그를 만들어서 ul태그 하위 요소로 넣는 기능
            todos.forEach((todo) => {
                const li = `<li class=${todo.completed ? "though": ""}>${todo.title}</li>`
                ul.innerHTML += li

                console.log()
            })
        })
</script>
</html>
